title: Pere Games
tagline: Small web games, made with care.
description: >-
  Pere Games is an independent studio making browser games. Play our games,
  read the dev blog, and follow every update on the public changelog.
url: "https://pere.games"
baseurl: ""
lang: en
# Shown on /advertise/. Leave empty until you have an address.
contact_email: "peregamesllc@gmail.com"

author:
  name: Pere Games

social:
  github: Catgenova
  # itch: your-itch-name
  # bluesky: you.bsky.social
  # discord: https://discord.gg/your-invite

# Ad space. Leave adsense_client empty to show the house "advertise here" slot.
# Setting adsense_client adds Google's verification tag and ad script to every
# page (enough for Auto ads) and fills in /ads.txt. Slot ids are only needed
# for the fixed ad boxes on the home page and under blog posts.
# Use the full id from AdSense, e.g. "ca-pub-1234567890123456".
ads:
  adsense_client: ""
  slots:
    home: ""
    sidebar: ""

collections:
  games:
    output: true
    permalink: /games/:name/
  changelog:
    output: true
    permalink: /changelog/:name/

# Sections switched off for now. To bring one back, set it to true here AND
# remove `published: false` from its page (blog/index.html or
# advertise/index.md); for the blog, also from the posts default below.
sections:
  blog: false
  advertise: false

defaults:
  - scope: { path: "", type: posts }
    values: { layout: post, permalink: "/blog/:year/:month/:title/", published: false }
  - scope: { path: "", type: games }
    values: { layout: game }
  - scope: { path: "", type: changelog }
    values: { layout: changelog-entry }

plugins:
  - jekyll-feed
  - jekyll-seo-tag

feed:
  path: blog/feed.xml
  collections:
    changelog:
      path: changelog/feed.xml

markdown: kramdown
excerpt_separator: <!--more-->

exclude:
  - README.md
  - CLAUDE.md
  - Gemfile
  - Gemfile.lock
  - vendor
