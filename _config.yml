title: Pere Games
tagline: Small web games, made with care.
description: >-
  Pere Games is an independent studio making browser games. Play our games,
  read the dev blog, and follow every update on the public changelog.
url: "https://pere.games"
baseurl: ""
lang: en
# Shown on /advertise/. Leave empty until you have an address.
contact_email: ""

author:
  name: Pere Games

social:
  github: Catgenova
  # itch: your-itch-name
  # bluesky: you.bsky.social
  # discord: https://discord.gg/your-invite

# Ad space. Leave adsense_client empty to show the house "advertise here" slot.
# When you get approved, set it (e.g. "ca-pub-1234567890") and fill in slot ids,
# then uncomment the line in /ads.txt.
ads:
  adsense_client: ""
  slots:
    home: ""
    sidebar: ""

collections:
  games:
    output: true
    permalink: /games/:name/
  changelog:
    output: true
    permalink: /changelog/:name/

defaults:
  - scope: { path: "", type: posts }
    values: { layout: post, permalink: "/blog/:year/:month/:title/" }
  - scope: { path: "", type: games }
    values: { layout: game }
  - scope: { path: "", type: changelog }
    values: { layout: changelog-entry }

plugins:
  - jekyll-feed
  - jekyll-seo-tag

feed:
  path: blog/feed.xml
  collections:
    changelog:
      path: changelog/feed.xml

markdown: kramdown
excerpt_separator: <!--more-->

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
