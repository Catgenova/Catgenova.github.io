# pere.games/homeschooling
#
# `links` is the list of official guidelines shown on the homeschooling home
# page. Add, remove or reword entries here; the page updates itself. Update
# `checked` when you've re-checked the links.

nav:
  - title: Overview
    url: /homeschooling/
  - title: Family setup
    url: /homeschooling/setup/
  - title: Letter of Intent
    url: /homeschooling/letter-of-intent/
  - title: IHIP
    url: /homeschooling/ihip/
  - title: Quarterly Reports
    url: /homeschooling/quarterly-report/
  - title: Annual Assessment
