{% assign app = include.app %}
<a class="app-card" href="{{ app.app_url | relative_url }}">
  <span class="app-card-top"><span class="mono">App / {{ app.status }}</span><span aria-hidden="true">&#8599;</span></span>
  <span class="app-card-art">
    {% if app.cover %}<img src="{{ app.cover | relative_url }}" alt="" loading="lazy">{% else %}<span class="cover-fallback">{{ app.title | slice: 0 }}</span>{% endif %}
  </span>
  <span class="app-card-title">{{ app.title }}</span>
  <span class="card-text">{{ app.tagline }}</span>
</a>
