{% assign game = include.game %}
<article class="game-card">
  <a class="game-cover" href="{{ game.url | relative_url }}" tabindex="-1" aria-hidden="true">
    {% if game.cover %}
    <img src="{{ game.cover | relative_url }}" alt="" loading="lazy">
    {% else %}
    <span class="game-cover-fallback">{{ game.title | slice: 0 }}</span>
    {% endif %}
  </a>
  <div class="game-body">
    <div class="game-meta">
      <span class="status status-{{ game.status | slugify }}">{{ game.status }}</span>
      {% for tag in game.tags limit: 3 %}<span class="tag">{{ tag }}</span>{% endfor %}
    </div>
    <h3><a href="{{ game.url | relative_url }}">{{ game.title }}</a></h3>
    <p>{{ game.tagline }}</p>
    <div class="game-actions">
      {% if game.play_url %}<a class="btn btn-primary" href="{{ game.play_url }}">Play</a>{% endif %}
      <a class="btn" href="{{ game.url | relative_url }}">Details</a>
    </div>
  </div>
</article>
