<header class="site-header">
  <div class="wrap header-inner">
    <a class="brand" href="{{ '/' | relative_url }}">
      <img src="{{ '/assets/img/logo/pere-logo-nav.png' | relative_url }}" alt="{{ site.title }}" width="82" height="40">
    </a>
    <nav aria-label="Main">
      <ul class="nav">
        {% for item in site.data.nav %}
        {% if item.section and site.sections[item.section] == false %}{% continue %}{% endif %}
        {% assign active = false %}
        {% if page.url == item.url or page.url contains item.url %}{% assign active = true %}{% endif %}
        <li><a href="{{ item.url | relative_url }}"{% if active %} aria-current="page"{% endif %}>{{ item.title }}</a></li>
        {% endfor %}
      </ul>
    </nav>
  </div>
</header>
