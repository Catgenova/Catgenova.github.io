---
layout: default
---
<div class="hs" data-hs-page="{{ page.hs_page }}">
  <nav class="hs-subnav" aria-label="Homeschooling forms">
    <ul>
      {% for item in site.data.homeschool.nav %}
      <li><a href="{{ item.url | relative_url }}"{% if page.url == item.url %} aria-current="page"{% endif %}>{{ item.title }}</a></li>
      {% endfor %}
    </ul>
  </nav>
  {{ content }}
</div>
{% if page.hs_form %}
<div class="hs-bar" id="hs-bar"></div>
<script defer src="{{ '/homeschooling/assets/lib/jspdf.umd.min.js' | relative_url }}"></script>
<script defer src="{{ '/homeschooling/assets/lib/jspdf.plugin.autotable.min.js' | relative_url }}"></script>
{% if page.hs_page == "assessment" %}<script defer src="{{ '/homeschooling/assets/lib/pdf-lib.min.js' | relative_url }}"></script>{% endif %}
{% endif %}
<script type="module" src="{{ '/homeschooling/assets/app.js' | relative_url }}?v={{ site.time | date: '%s' }}"></script>
