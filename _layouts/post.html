---
layout: default
---
<article class="prose">
  <p class="eyebrow"><a href="{{ '/blog/' | relative_url }}">&larr; Blog</a></p>
  <h1>{{ page.title }}</h1>
  <p class="byline">
    <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time>
    {% if page.author %} · {{ page.author }}{% endif %}
  </p>
  {{ content }}
</article>
{% include ad-slot.html slot="sidebar" %}
