<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Crossword · Pere Games</title>
<meta name="description" content="Free crosswords from Pere Games: three new puzzles every day (a small 7×7, a medium 11×11 and a large themed 15×15), plus big holiday specials.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f7f1e6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#15110d" media="(prefers-color-scheme: dark)">
<meta property="og:title" content="Pere Games Crossword">
<meta property="og:description" content="Three new crosswords every day: small, medium and large. Play free in your browser.">
<meta property="og:image" content="https://pere.games/assets/img/games/crossword.png">
<link rel="icon" href="../icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Space+Grotesk:wght@400;500;700&display=swap">
<link rel="stylesheet" href="../crossword.css?v=4">
</head>
<body class="loading">

<header class="top">
  <div class="brand">
    <a class="home" href="../" aria-label="All puzzles"><span>Puzzles</span></a>
    <div class="heading">
      <h1 id="title">Crossword</h1>
      <p class="meta" id="meta"></p>
    </div>
    <nav class="daynav" id="daynav" aria-label="Other days" hidden>
      <a class="tool icon" id="day-prev" aria-label="Previous day's puzzle">&lsaquo;</a>
      <a class="tool icon" id="day-next" aria-label="Next day's puzzle">&rsaquo;</a>
    </nav>
  </div>

  <div class="tools" role="toolbar" aria-label="Puzzle tools">
    <div class="levels" id="levels" role="group" aria-label="Difficulty" hidden></div>
    <span class="progress" id="progress" aria-live="off"></span>
    <button type="button" class="tool timer" id="timer" aria-label="Pause timer"><span class="ico-pause" aria-hidden="true"></span><span id="clock">0:00</span></button>

    <details class="menu">
      <summary class="tool">Check</summary>
      <div class="pop" role="menu">
        <button type="button" role="menuitem" data-act="check-cell">Square</button>
        <button type="button" role="menuitem" data-act="check-word">Word</button>
        <button type="button" role="menuitem" data-act="check-all">Puzzle</button>
        <label class="toggle"><input type="checkbox" id="autocheck"> <span id="autocheck-label">Autocheck as I type</span></label>
      </div>
    </details>
    <details class="menu">
      <summary class="tool">Reveal</summary>
      <div class="pop" role="menu">
        <button type="button" role="menuitem" data-act="reveal-cell">Square</button>
        <button type="button" role="menuitem" data-act="reveal-word">Word</button>
        <button type="button" role="menuitem" data-act="reveal-all">Puzzle</button>
      </div>
    </details>
    <details class="menu">
      <summary class="tool">Clear</summary>
      <div class="pop" role="menu">
        <button type="button" role="menuitem" data-act="clear-word">Word</button>
        <button type="button" role="menuitem" data-act="clear-wrong">Wrong letters</button>
        <button type="button" role="menuitem" data-act="clear-all">Puzzle and timer</button>
      </div>
    </details>
  </div>
</header>

<main class="layout">
  <section class="board" aria-label="Grid">
    <div class="cluebar">
      <button type="button" class="nav" data-act="prev" aria-label="Previous clue">&lsaquo;</button>
      <p id="cluebar"><b id="cb-num"></b> <span id="cb-text"></span> <span class="enum" id="cb-enum"></span></p>
      <button type="button" class="nav" data-act="next" aria-label="Next clue">&rsaquo;</button>
    </div>
    <div class="stage">
      <div class="viewport" id="viewport">
        <div class="grid" id="grid">
          <input id="entry" class="entry" type="text" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false" enterkeyhint="next" aria-label="Crossword answer">
        </div>
      </div>
      <span class="zoom" role="group" aria-label="Zoom">
        <button type="button" data-act="zoom-out" aria-label="Zoom out">&minus;</button>
        <button type="button" data-act="zoom-fit" aria-label="Show the whole grid">Fit</button>
        <button type="button" data-act="zoom-in" aria-label="Zoom in">+</button>
      </span>
    </div>
    <div class="paused" id="paused" hidden>
      <p class="paused-title">Paused</p>
      <button type="button" class="btn" data-act="resume">Keep solving</button>
    </div>
    <p class="hint">Type to fill · Space or click again switches direction · Tab for the next clue · Arrows move</p>
  </section>

  <section class="clues" aria-label="Clues">
    <div class="tabs" role="tablist">
      <button type="button" role="tab" id="tab-a" aria-selected="true" aria-controls="list-a">Across</button>
      <button type="button" role="tab" id="tab-d" aria-selected="false" aria-controls="list-d">Down</button>
    </div>
    <div class="list show" id="list-a" role="tabpanel" aria-labelledby="tab-a">
      <h2>Across</h2>
      <ol id="across"></ol>
    </div>
    <div class="list" id="list-d" role="tabpanel" aria-labelledby="tab-d">
      <h2>Down</h2>
      <ol id="down"></ol>
    </div>
  </section>
</main>

<div class="notice" id="notice" hidden>
  <p id="notice-text"></p>
  <a class="btn primary" href="../">See all puzzles</a>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<dialog id="done" aria-labelledby="done-title">
  <p class="done-leaf" aria-hidden="true">🎉</p>
  <h2 id="done-title">Solved!</h2>
  <p id="done-text"></p>
  <div class="done-actions">
    <button type="button" class="btn primary" data-act="close-done">Admire the grid</button>
    <a class="btn" id="done-harder" hidden>Try it on Hard</a>
    <a class="btn" href="../">More puzzles</a>
  </div>
</dialog>

<script src="../crossword.js?v=4"></script>
</body>
</html>
