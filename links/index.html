---
layout: default
title: Other Links
description: Other Pere Games projects and resources.
---
<div class="page-head">
  <p class="label">Other links</p>
  <h1 class="display-2">More from<br><span class="dim">Pere Games.</span></h1>
</div>
<ul class="link-list">
  {% for link in site.data.other_links %}
  <li>
    <a href="{{ link.url | relative_url }}">{{ link.title }}</a>
    {% if link.description %}<p class="muted">{{ link.description }}</p>{% endif %}
  </li>
  {% endfor %}
</ul>
